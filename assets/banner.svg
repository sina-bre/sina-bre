<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Sina Baradaran - Front-End Developer</title>
  <desc id="dsc">A terminal session: whoami prints Sina Baradaran, Front-End Developer at Yekta Group in Mashhad, Iran; cat stack.txt lists React, Next.js, TypeScript, Tailwind CSS, TanStack Query, Node.js and SQL Server; open points to dev.sinabaradaran01.workers.dev.</desc>

  <style>
    .sans { font-family: Geist, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* A cover the colour of the window slides off each command one character at a time. */
    .cover { fill: #0b0b0c; }
    .t1 { animation: t1 .5s steps(6) .4s forwards; }
    .t2 { animation: t2 .7s steps(13) 1.9s forwards; }
    .t3 { animation: t3 1.1s steps(36) 3.3s forwards; }
    @keyframes t1 { to { transform: translateX(54px); } }
    @keyframes t2 { to { transform: translateX(117px); } }
    @keyframes t3 { to { transform: translateX(324px); } }

    .show { opacity: 0; animation: show .6s cubic-bezier(.16, 1, .3, 1) forwards; }
    .d1 { animation-delay: 1s; } .d2 { animation-delay: 1.2s; } .d3 { animation-delay: 1.6s; }
    .d4 { animation-delay: 2.7s; } .d5 { animation-delay: 3.1s; } .d6 { animation-delay: 4.5s; }
    .d7 { animation-delay: 4.8s; }
    @keyframes show { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cover { display: none; }
      .show { opacity: 1; animation: none; }
      .blink { animation: none; }
    }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="100%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ff5b2e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff5b2e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="430" rx="14"/></clipPath>
    <!-- one prompt, reused on every line -->
    <g id="prompt" class="mono" font-size="15">
      <text textLength="108" lengthAdjust="spacing"><tspan fill="#ff5b2e">sina@dev</tspan><tspan fill="#55534f"> ~ </tspan><tspan fill="#f3f0ea">$</tspan></text>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="430" fill="#0b0b0c"/>
    <rect width="1000" height="430" fill="url(#dots)"/>
    <rect width="1000" height="430" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="1000" height="44" fill="#131315"/>
    <line x1="0" y1="44.5" x2="1000" y2="44.5" stroke="#232326"/>
    <circle cx="26" cy="22" r="6" fill="#ff5b2e"/>
    <circle cx="46" cy="22" r="6" fill="#232326"/>
    <circle cx="66" cy="22" r="6" fill="#232326"/>
    <text x="500" y="27" text-anchor="middle" class="mono" font-size="13" fill="#8f8b84">sina@dev: ~/portfolio — zsh</text>
    <text x="974" y="27" text-anchor="end" class="mono" font-size="12" fill="#55534f">IRST · UTC+3:30</text>

    <!-- $ whoami -->
    <use href="#prompt" x="40" y="88"/>
    <text x="156" y="88" class="mono" font-size="15" fill="#f3f0ea" textLength="54">whoami</text>
    <rect class="cover t1" x="154" y="72" width="58" height="22"/>

    <text x="38" y="152" class="sans show d1" font-size="60" font-weight="600" letter-spacing="-2.6" fill="#f3f0ea">Sina Baradaran</text>
    <text x="40" y="186" class="mono show d2" font-size="16" fill="#8f8b84"><tspan fill="#ff5b2e">Front-End Developer</tspan> @ Yekta Group · Mashhad, Iran</text>

    <!-- status panel -->
    <g class="mono show d2" font-size="13">
      <rect x="690" y="70" width="270" height="168" rx="10" fill="#131315" stroke="#232326"/>
      <line x1="690" y1="104.5" x2="960" y2="104.5" stroke="#232326"/>
      <text x="708" y="92" fill="#8f8b84">~/.status.json</text>
      <circle cx="940" cy="88" r="4" fill="#ff5b2e" class="blink"/>
      <text x="708" y="132" fill="#55534f">"open_to_work"<tspan x="836" fill="#ff5b2e">true</tspan></text>
      <text x="708" y="158" fill="#55534f">"focus"<tspan x="836" fill="#f3f0ea">"frontend"</tspan></text>
      <text x="708" y="184" fill="#55534f">"experience"<tspan x="836" fill="#f3f0ea">"3+ years"</tspan></text>
      <text x="708" y="210" fill="#55534f">"studying"<tspan x="836" fill="#f3f0ea">"MSc SE"</tspan></text>
    </g>

    <!-- $ cat stack.txt -->
    <g class="show d3"><use href="#prompt" x="40" y="236"/></g>
    <text x="156" y="236" class="mono" font-size="15" fill="#f3f0ea" textLength="117">cat stack.txt</text>
    <rect class="cover t2" x="154" y="220" width="121" height="22"/>

    <text x="40" y="266" class="mono show d4" font-size="15" fill="#f3f0ea" xml:space="preserve">react  next.js  typescript  tailwind  tanstack-query  <tspan fill="#8f8b84">node.js  express  sql-server</tspan></text>

    <!-- $ open portfolio -->
    <g class="show d5"><use href="#prompt" x="40" y="316"/></g>
    <text x="156" y="316" class="mono" font-size="15" fill="#f3f0ea" textLength="324">open dev.sinabaradaran01.workers.dev</text>
    <rect class="cover t3" x="154" y="300" width="328" height="22"/>

    <text x="40" y="346" class="mono show d6" font-size="15" fill="#8f8b84"><tspan fill="#ff5b2e">✓</tspan> portfolio · resume · contact — all in one place</text>

    <!-- idle prompt -->
    <g class="show d7">
      <use href="#prompt" x="40" y="396"/>
      <rect class="blink" x="158" y="382" width="9" height="18" fill="#ff5b2e"/>
    </g>
  </g>
</svg>
