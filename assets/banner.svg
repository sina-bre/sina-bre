<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Sina Baradaran - Front-End Developer</title>
  <desc id="dsc">Sina Baradaran, Front-End Developer at Yekta Group in Mashhad, Iran. React, Next.js, TypeScript, Node.js and SQL Server.</desc>

  <style>
    .sans { font-family: Geist, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise 1s cubic-bezier(.16, 1, .3, 1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .strip { animation: strip 28s linear infinite; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes strip { to { transform: translateX(-780px); } }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="100%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ff5b2e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff5b2e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="400" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="400" fill="#0b0b0c"/>
    <rect width="1000" height="400" fill="url(#dots)"/>
    <rect width="1000" height="400" fill="url(#glow)"/>

    <!-- status pill and location, as in the site hero -->
    <g class="rise">
      <rect x="48" y="44" width="318" height="32" rx="16" fill="none" stroke="#232326"/>
      <circle class="pulse" cx="68" cy="60" r="4" fill="#ff5b2e"/>
      <text x="82" y="65" class="sans" font-size="14" fill="#8f8b84">Now: Front-End Developer at Yekta Group</text>
      <text x="952" y="65" text-anchor="end" class="mono" font-size="12" fill="#8f8b84">Mashhad, Iran · IRST</text>
    </g>

    <!-- name and role -->
    <text x="44" y="210" class="sans rise d1" font-size="96" font-weight="600" letter-spacing="-4.3" fill="#f3f0ea">Sina Baradaran</text>
    <text x="48" y="262" class="sans rise d2" font-size="32" font-weight="500" letter-spacing="-0.8" fill="#f3f0ea">Front-End <tspan fill="#ff5b2e">Developer</tspan></text>
    <text x="48" y="300" class="sans rise d3" font-size="16" fill="#8f8b84">Two live platforms, their admin panels, and the API behind them.</text>

    <!-- tech strip: copies are pinned to 780px apart so the loop is seamless in any font -->
    <line x1="0" y1="340" x2="1000" y2="340" stroke="#232326"/>
    <g class="mono" font-size="13" letter-spacing="2" fill="#8f8b84">
      <g class="strip">
        <text x="0" y="375" textLength="760" lengthAdjust="spacingAndGlyphs">REACT · NEXT.JS · TYPESCRIPT · TAILWIND CSS · TANSTACK QUERY · NODE.JS · SQL SERVER ·</text>
        <text x="780" y="375" textLength="760" lengthAdjust="spacingAndGlyphs">REACT · NEXT.JS · TYPESCRIPT · TAILWIND CSS · TANSTACK QUERY · NODE.JS · SQL SERVER ·</text>
        <text x="1560" y="375" textLength="760" lengthAdjust="spacingAndGlyphs">REACT · NEXT.JS · TYPESCRIPT · TAILWIND CSS · TANSTACK QUERY · NODE.JS · SQL SERVER ·</text>
      </g>
    </g>
  </g>
</svg>
