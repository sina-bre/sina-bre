name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Build the snake SVG from my contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: sina-bre
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ff5b2e&color_dots=#161618,#3a1a10,#6e2a14,#b8401b,#ff5b2e

      - name: Push it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
